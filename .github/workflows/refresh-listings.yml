name: Refresh listings

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# GitHub sometimes starts the same cron twice. Queue the second run and
# rebase before push so it does not fail with "fetch first".
concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch listings snapshot
        run: python3 bake_listings.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/listings.json
          if git diff --cached --quiet; then
            echo "No listing changes"
          else
            git commit -m "Refresh Reata Ranch listings snapshot."
            git pull --rebase origin main
            git push
          fi
