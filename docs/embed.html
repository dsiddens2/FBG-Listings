<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discover FBG listings embed</title>
  <link rel="stylesheet" href="embed.css">
  <style>
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: #fff; color: #111; }
    .preview-pad { max-width: 1180px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    .preview-note { margin: 0 0 1.5rem; color: #666; font: 0.9rem/1.4 system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="preview-pad">
    <p class="preview-note">Standalone listings embed (light, 3-up) — shuffle on each load.</p>
    <div class="fbg-listings-embed" data-theme="light" data-align="center" data-heading="Browse local listings" data-columns="3" data-limit="3" data-listings-url="listings.json"></div>
  </div>
  <script src="embed.js"></script>
</body>
</html>
